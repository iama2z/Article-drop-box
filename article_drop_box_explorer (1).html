<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science Article Drop Box</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        .preview-enter {
            opacity: 0;
            transform: translateY(10px) scale(0.95);
            transition: all 0.2s ease-out;
        }
        .preview-enter-active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const articleData = {
            "7th Grade": [
                {
                    id: "7.1",
                    title: "Unit 7.1: Chemical Reactions & Matter",
                    topics: [
                        {
                            name: "Chemical Reactions, Gases, & Bath Bombs",
                            articles: [
                                { title: "Science Isn't Just for Scientists", url: "https://www.snexplores.org/article/science-isnt-just-for-scientists", difficulty: 1 },
                                { title: "Middle School Green Chemistry Resource", url: "https://www.sciencebuddies.org/science-experiments/green-chemistry/middle-school", difficulty: 2, isLab: true },
                                { title: "Anatomy of a Bath Bomb", url: "https://www.fleetscience.org/blog/2019/08/anatomy-bath-bomb", difficulty: 2 },
                                { title: "Bath Bomb Science", url: "https://www.sciencebuddies.org/science-fair-projects/project-ideas/Chem_p105/chemistry/bath-bomb-science", difficulty: 3, isLab: true }
                            ]
                        },
                        {
                            name: "Conservation of Matter & Chemical Changes",
                            articles: [
                                { title: "Generation Genius Lesson and Definitions", url: "https://www.generationgenius.com/definition/law-of-conservation-of-matter-definition/", difficulty: 1 },
                                { title: "Where Did It Come From? Where Did It Go?", url: "https://www.micds.org/news/article/where-did-it-come-from-where-did-it-go-students-discover-laws-of-conservation/", difficulty: 2 },
                                { title: "Conservation of Matter During Physical and Chemical Changes", url: "https://education.nationalgeographic.org/resource/conservation-matter-during-physical-and-chemical-changes/7th-grade/", difficulty: 2 },
                                { title: "Baking Soda vs. Baking Powder Breakdown", url: "https://www.mcgill.ca/oss/article/student-contributors-general-science/whats-difference-between-baking-soda-and-baking-powder", difficulty: 3 }
                            ]
                        },
                        {
                            name: "Odors, Gases & Acid Rain",
                            articles: [
                                { title: "Peace Monument", url: "https://www.aoc.gov/explore-capitol-campus/features/peace-monument", difficulty: 3 },
                                { title: "Mosquitoes Can Smell Your Sweat", url: "https://www.smithsonianmag.com/smart-news/mosquitoes-use-compounds-sweat-hunt-you-down-180971833/", difficulty: 3 },
                                { title: "Science on Stage Europe Acid Rain Activity Guide", url: "https://www.science-on-stage.eu/material/how-does-acid-rain-damage-our-buildings", difficulty: 4, isLab: true }
                            ]
                        },
                        {
                            name: "Related DCIs, Elements, and Extensions",
                            articles: [
                                { title: "Let's Learn About the Carbon Cycle", url: "https://www.snexplores.org/article/lets-learn-about-the-carbon-cycle", difficulty: 1 },
                                { title: "The Coolest Material on Earth", url: "https://www.sciencebuddies.org/science-experiments/green-chemistry/middle-school", difficulty: 3, isLab: true },
                                { title: "NOAA Oil Spill Modeling Tutorial", url: "https://oceanservice.noaa.gov/education/tutorial-coastal/oil-spills/os03-sub-01.html", difficulty: 4 },
                                { title: "VRLab Mass Conservation History Review", url: "https://www.vrlabacademy.com/en/Blog/ExperimentsThatChangedMass", difficulty: 4 },
                                { title: "CABI Soil Science Forensic Case Guide", url: "https://www.cabidigitallibrary.org/doi/10.1079/soilsciencecases.2024.0004", difficulty: 5, isLab: true }
                            ]
                        }
                    ]
                },
                {
                    id: "7.3",
                    title: "Unit 7.3: Metabolic Reactions",
                    topics: [
                        {
                            name: "Digestion, Autoimmunity, & M'Kenna's Small Intestine",
                            articles: [
                                { title: "Teens Invent First Chewing Gum to Tackle Anxiety", url: "https://www.snexplores.org/article/chewing-gum-relieve-anxiety", difficulty: 2 },
                                { title: "Why People with Celiac Disease Suffer After Eating Gluten", url: "https://www.sciencenews.org/article/why-people-celiac-disease-suffer-so-soon-after-eating-gluten", difficulty: 4 },
                                { title: "How a Revolutionary Cancer Treatment Could Reset Immune Systems", url: "https://www.smithsonianmag.com/innovation/how-a-revolutionary-cancer-treatment-could-reset-the-immune-systems-of-patients-with-autoimmune-diseases-180988753/", difficulty: 4 }
                            ]
                        },
                        {
                            name: "Body Systems, Cellular Respiration, and Energy",
                            articles: [
                                { title: "Let's Learn About Adrenaline", url: "https://www.snexplores.org/article/lets-learn-about-adrenaline", difficulty: 1 },
                                { title: "Let's Learn About Exercise", url: "https://www.snexplores.org/article/lets-learn-about-exercise", difficulty: 2 },
                                { title: "6 Surprising Science-Backed Ways to Beat the Heat", url: "https://www.snexplores.org/article/6-ways-science-beat-summer-heat", difficulty: 2 },
                                { title: "Positive Thinking Could Help Boost Your Immune System", url: "https://www.snexplores.org/article/positive-thinking-boost-immune-system", difficulty: 2 },
                                { title: "Does the Experience of Beauty Show Up in the Brain?", url: "https://www.smithsonianmag.com/science-nature/does-the-experience-of-beauty-show-up-in-the-brain-with-electrodes-and-a-museum-collection-of-artifacts-these-neuroscientists-aim-to-find-out-180988737/", difficulty: 3 }
                            ]
                        }
                    ]
                },
                {
                    id: "7.4",
                    title: "Unit 7.4: Matter Cycling & Photosynthesis",
                    topics: [
                        {
                            name: "Plants, Light, and Food Molecules",
                            articles: [
                                { title: "Watch Leaves Change Color in a Matter of Seconds", url: "https://www.smithsonianmag.com/science-nature/watch-leaves-change-color-matter-of-seconds-180972903/", difficulty: 1 },
                                { title: "Why Do Leaves Change Color in the Fall?", url: "https://www.smithsonianmag.com/blogs/smithsonian-science-education-center/2017/11/08/why-do-leaves-change-color-fall/", difficulty: 2 },
                                { title: "Welcome to the Arctic's All-Night Undersea Party", url: "https://www.snexplores.org/article/welcome-arctics-all-night-undersea-party", difficulty: 2 },
                                { title: "Carnivorous Plants Have Been Trapping Animals for Millions of Years", url: "https://www.smithsonianmag.com/science-nature/carnivorous-plants-have-been-trapping-animals-for-millions-of-years-so-why-have-they-never-grown-larger-180986708/", difficulty: 4 }
                            ]
                        },
                        {
                            name: "Food Sources & Human/Ecosystem Impacts",
                            articles: [
                                { title: "Crops are being engineered to thrive in our changing climate", url: "https://www.snexplores.org/article/crops-engineered-climate-agriculture-success", difficulty: 3 },
                                { title: "High-tech solar 'leaves' create green fuels from the sun", url: "https://www.snexplores.org/article/solar-leaves-technology-green-fuel", difficulty: 3 },
                                { title: "These Charcoal-Eating Fungi Flourish After Fires", url: "https://www.smithsonianmag.com/tag/trees/", difficulty: 3 }
                            ]
                        }
                    ]
                },
                {
                    id: "7.6",
                    title: "Unit 7.6: Earth's Resources & Human Impact",
                    topics: [
                        {
                            name: "Water, Rising Temperatures, & Resource Distribution",
                            articles: [
                                { title: "Seaweed farming is surging, but can it really capture carbon long-term?", url: "https://www.smithsonianmag.com/innovation/could-sinking-tons-of-seaweed-to-the-ocean-floor-help-combat-climate-change-180983637/", difficulty: 3 },
                                { title: "Uncovering Earth's History in the Bighorn Basin", url: "https://www.smithsonianmag.com/travel/day-2-uncovering-earths-history-in-the-bighorn-basin-37478883/", difficulty: 4 },
                                { title: "Perspective: How energy and chemistry converge for a fossil-free future", url: "https://www.sciencedirect.com/science/article/pii/S2589004225020486", difficulty: 5 }
                            ]
                        },
                        {
                            name: "Carbon Solutions",
                            articles: [
                                { title: "6 Ways to Remove Carbon Pollution from the Atmosphere", url: "https://www.wri.org/insights/6-ways-remove-carbon-pollution-sky", difficulty: 3 },
                                { title: "New ways to remove CO2 from atmosphere must grow much faster", url: "https://www.theguardian.com/environment/2026/jun/02/new-ways-remove-co2-from-atmosphere-carbon-dioxide-removal", difficulty: 3 },
                                { title: "What is the most efficient way to remove CO2 from the atmosphere?", url: "https://climate.mit.edu/ask-mit/what-most-efficient-way-remove-co2-atmosphere", difficulty: 4 }
                            ]
                        }
                    ]
                }
            ],
            "8th Grade": [
                {
                    id: "8.1",
                    title: "Unit 8.1: Contact Forces/Collisions",
                    topics: [
                        {
                            name: "Force Interactions and Collisions",
                            articles: [
                                { title: "Science Isn't Just for Scientists", url: "https://www.snexplores.org/article/science-isnt-just-for-scientists", difficulty: 1 },
                                { title: "First responders train on newer vehicles as car technology complicates crash rescues", url: "https://www.29news.com/2026/05/20/first-responders-train-newer-vehicles-car-technology-complicates-crash-rescues/", difficulty: 2 },
                                { title: "Forces and Motion: The Physics of a Car Crash", url: "https://roadsense.org.au/what-happens-to-the-body-in-a-crash/", difficulty: 3 },
                                { title: "How Advanced Crash-Avoidance Tech Will Change Car Safety", url: "https://www.motortrend.com/features/advanced-crash-avoidance-technology-car-safety-future-cars", difficulty: 3 },
                                { title: "Orca rams into sunfish, explodes", url: "https://www.sciencenews.org/article/orca-ram-into-sunfish-explodes", difficulty: 3 }
                            ]
                        }
                    ]
                },
                {
                    id: "8.3",
                    title: "Unit 8.3: Forces at a Distance",
                    topics: [
                        {
                            name: "Magnetic Fields, Energy Transfer & Electromagnets",
                            articles: [
                                { title: "Engineering Speakers: Understanding Electromagnets and Sound", url: "https://www.knowatom.com/science-phenomena-videos/7th-grade-science/engineering-speakers", difficulty: 3 },
                                { title: "How Does a Speaker Work?", url: "https://astrocamp.org/blog/speaker/", difficulty: 3 },
                                { title: "Stars' plasma spurts may be blocked by magnetic fields", url: "https://www.sciencenews.org/article/stars-eruptions-plasma-magnetic-fields%20", difficulty: 4 }
                            ]
                        }
                    ]
                },
                {
                    id: "8.4",
                    title: "Unit 8.4: Earth in Space",
                    topics: [
                        {
                            name: "Sun, Moon, and Earth Patterns",
                            articles: [
                                { title: "Eclipses Come in Many Forms", url: "https://www.snexplores.org/article/eclipses-come-many-forms", difficulty: 1 },
                                { title: "Artemis Astronauts", url: "https://www.snexplores.org/article/nasa-new-diverse-crew-astronauts-artemis-mission-moon", difficulty: 2 },
                                { title: "Manhattanhenge 26", url: "https://weather.com/2026/05/28/news/trending/manhattanhenge-returns-when-and-where-to-watch-nycs-iconic-spectacle", difficulty: 2 },
                                { title: "Lunar Eclipses and the Moon's Orbit", url: "https://science.nasa.gov/moon/eclipses/", difficulty: 3 }
                            ]
                        }
                    ]
                },
                {
                    id: "8.6",
                    title: "Unit 8.6: Genetics",
                    topics: [
                        {
                            name: "Traits, Variation, and Inheritance",
                            articles: [
                                { title: "Horses became gentle and easy to ride thanks to two gene mutations", url: "https://www.snexplores.org/article/horses-ride-tame-genes-breeding", difficulty: 2 },
                                { title: "Some identical twins don't have the exact same DNA", url: "https://www.snexplores.org/article/some-identical-twins-dont-have-identical-dna-genetics", difficulty: 2 },
                                { title: "Do Muscular Cows Demonstrate Genetic Engineering Potential?", url: "https://www.snopes.com/fact-check/muscular-cows-genetic-engineering/", difficulty: 3 },
                                { title: "A child's biological sex may not always be a random 50-50 chance", url: "https://www.sciencenews.org/article/biological-sex-random-chance", difficulty: 4 },
                                { title: "CRISPR takes a bold leap toward silencing Down syndrome's extra chromosome", url: "https://medicalxpress.com/news/2026-04-crispr-bold-silencing-syndrome-extra.html", difficulty: 4 }
                            ]
                        }
                    ]
                }
            ]
        };

        
        // Component to render the 5-star difficulty rating
        const StarRating = ({ rating }) => {
            return (
                <div className="flex items-center space-x-1" title={`Reading Difficulty: ${rating} out of 5 stars`}>
                    {[1, 2, 3, 4, 5].map((star) => (
                        <i key={star} className={`ph-fill ph-star text-sm ${star <= rating ? 'text-amber-400' : 'text-slate-200'}`}></i>
                    ))}
                    <span className="text-xs text-slate-500 ml-2 font-medium">Lvl {rating}</span>
                </div>
            );
        };

        // Helper function to extract domain name for the preview
        const getDomain = (url) => {
            try {
                const domain = new URL(url).hostname;
                return domain.replace('www.', '');
            } catch (e) {
                return 'External Link';
            }
        };


        const ArticleItem = ({ article }) => {
            const [isHovered, setIsHovered] = React.useState(false);
            const domain = getDomain(article.url);

            return (
                <li 
                    className="relative flex items-center justify-between p-4 bg-white rounded-xl border border-slate-100 shadow-sm hover:shadow-md hover:border-blue-200 transition-all duration-200 group"
                    onMouseEnter={() => setIsHovered(true)}
                    onMouseLeave={() => setIsHovered(false)}
                >
                    <div className="flex-1 min-w-0 pr-4">
                        <a 
                            href={article.url} 
                            target="_blank" 
                            rel="noopener noreferrer"
                            className="flex items-center space-x-3 text-slate-700 hover:text-blue-600 transition-colors"
                        >
                            <div className="flex-shrink-0 w-8 h-8 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center group-hover:bg-blue-500 group-hover:text-white transition-colors">
                                <i className="ph ph-article text-lg"></i>
                            </div>
                            <span className="font-semibold truncate text-sm md:text-base">{article.title}</span>
                            {article.isLab && (
                                <span className="flex-shrink-0 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider bg-purple-100 text-purple-700 rounded-full border border-purple-200">
                                    Lab Setup
                                </span>
                            )}
                            <i className="flex-shrink-0 ph ph-arrow-up-right text-slate-400 opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        </a>
                    </div>
                    
                    <div className="flex-shrink-0">
                        <StarRating rating={article.difficulty} />
                    </div>

                    {/* Hover Preview Card */}
                    {isHovered && (
                        <div className="absolute top-full left-0 mt-2 w-80 bg-slate-800 text-white p-4 rounded-xl shadow-2xl z-50 preview-enter-active">
                            <div className="flex justify-between items-start mb-2">
                                <span className="text-xs font-semibold text-blue-300 uppercase tracking-wider">{domain}</span>
                                <i className="ph ph-link text-slate-400"></i>
                            </div>
                            <h4 className="font-bold text-sm leading-tight mb-3">
                                {article.title}
                                {article.isLab && (
                                    <span className="inline-block align-middle ml-2 px-1.5 py-0.5 text-[9px] font-bold uppercase tracking-wider bg-purple-900/50 text-purple-300 rounded border border-purple-700">
                                        Lab Setup
                                    </span>
                                )}
                            </h4>
                            <div className="flex justify-between items-center border-t border-slate-600 pt-3 mt-3">
                                <span className="text-xs text-slate-300">Difficulty Level</span>
                                <div className="flex items-center space-x-1">
                                    {[1, 2, 3, 4, 5].map((star) => (
                                        <i key={`prev-${star}`} className={`ph-fill ph-star text-xs ${star <= article.difficulty ? 'text-amber-400' : 'text-slate-600'}`}></i>
                                    ))}
                                </div>
                            </div>
                            <div className="absolute -top-2 left-8 w-4 h-4 bg-slate-800 transform rotate-45 rounded-sm"></div>
                        </div>
                    )}
                </li>
            );
        };


        const TopicSection = ({ topic }) => (
            <div className="mb-6 last:mb-0">
                <h4 className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3 ml-2 flex items-center space-x-2">
                    <i className="ph ph-folder-notch-open"></i>
                    <span>{topic.name}</span>
                </h4>
                <ul className="space-y-3">
                    {topic.articles.map((article, idx) => (
                        <ArticleItem key={idx} article={article} />
                    ))}
                </ul>
            </div>
        );

        const UnitCard = ({ unit }) => (
            <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 mb-8">
                <div className="flex items-center space-x-3 mb-6 pb-4 border-b border-slate-200">
                    <div className="w-10 h-10 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold text-xl">
                        {unit.id.split('.')[1]}
                    </div>
                    <h3 className="text-xl md:text-2xl font-bold text-slate-800">{unit.title}</h3>
                </div>
                <div>
                    {unit.topics.map((topic, idx) => (
                        <TopicSection key={idx} topic={topic} />
                    ))}
                </div>
            </div>
        );


        const App = () => {
            const [activeGrade, setActiveGrade] = React.useState("7th Grade");

            return (
                <div className="min-h-screen pb-20">
                    {/* Header */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-40">
                        <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex flex-col md:flex-row md:items-center md:justify-between py-6">
                                <div className="flex items-center space-x-4">
                                    <div className="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                                        <i className="ph ph-flask text-2xl"></i>
                                    </div>
                                    <div>
                                        <h1 className="text-2xl font-bold text-slate-900 tracking-tight">Article Drop Box Explorer</h1>
                                        <p className="text-slate-500 text-sm font-medium">Maize Middle School • OpenSciEd</p>
                                    </div>
                                </div>
                                
                                {/* Grade Selector */}
                                <div className="mt-6 md:mt-0 flex p-1 bg-slate-100 rounded-xl w-fit">
                                    {Object.keys(articleData).map((grade) => (
                                        <button
                                            key={grade}
                                            onClick={() => setActiveGrade(grade)}
                                            className={`px-6 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 ${
                                                activeGrade === grade 
                                                ? 'bg-white text-blue-600 shadow-sm border border-slate-200/50' 
                                                : 'text-slate-500 hover:text-slate-700 hover:bg-slate-200/50'
                                            }`}
                                        >
                                            {grade}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 pt-10">
                        <div className="mb-8 flex items-center justify-between">
                            <h2 className="text-3xl font-bold text-slate-800 flex items-center space-x-3">
                                <span>{activeGrade} Units</span>
                            </h2>
                            <div className="hidden md:flex items-center space-x-2 text-sm text-slate-500 bg-slate-100 px-4 py-2 rounded-full">
                                <i className="ph ph-info"></i>
                                <span>Hover over links for details</span>
                            </div>
                        </div>

                        {/* Units List */}
                        <div className="space-y-8 animate-fade-in-up">
                            {articleData[activeGrade].map((unit) => (
                                <UnitCard key={unit.id} unit={unit} />
                            ))}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
